name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Patch IHP Standard Cell Library for Icarus (strips specify blocks and connects delayed_* signals)
      - name: Patch IHP Standard Cell Library for Icarus
        shell: bash
        run: |
          STDCELL_FILE="$PDK_ROOT/ihp-sg13g2/libs.ref/sg13g2_stdcell/verilog/sg13g2_stdcell.v"
          if [ -f "$STDCELL_FILE" ]; then
            python3 test/patch_ihp_delayed_signals.py "$STDCELL_FILE" > "${STDCELL_FILE}.tmp"
            sed -i '/specify/,/endspecify/d' "${STDCELL_FILE}.tmp"
            mv "${STDCELL_FILE}.tmp" "$STDCELL_FILE"
          fi

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26b

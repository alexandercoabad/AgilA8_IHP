name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # Patch IHP Standard Cell library for Icarus (connect delayed_* signals & strip specify blocks)
      - name: Patch IHP Standard Cell Library for Icarus
        shell: bash
        run: |
          STDCELL_FILE="$PDK_ROOT/ihp-sg13g2/libs.ref/sg13g2_stdcell/verilog/sg13g2_stdcell.v"
          if [ -f "$STDCELL_FILE" ]; then
            python3 test/patch_ihp_delayed_signals.py "$STDCELL_FILE" > "${STDCELL_FILE}.tmp"
            sed -i '/specify/,/endspecify/d' "${STDCELL_FILE}.tmp"
            mv "${STDCELL_FILE}.tmp" "$STDCELL_FILE"
          fi

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
